<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Waste Detection System</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Dark Mode Toggle -->
    <button id="themeToggle" class="theme-toggle">🌙 Dark Mode</button>

    <!-- Header with Logo -->
    <header class="header">
        <div class="container text-center">
            <h1>
                <img src="https://bing.com/th/id/BCO.acc5290e-7763-4e2c-aeef-a817a0bf94ad.png" alt="Logo" class="header-image">
            </h1>
            <h1>
                Real-time Waste Detection System: An End-to-End YOLOv5 Solution
            </h1>
        </div>
    </header>

    <!-- Upload & Predict Section -->
        <h1>
                
            </h1>
    <div class="container">
        <form class="upload-section">
            <button type="button" class="btn upload-btn" id="uploadBtn" title="Upload an image">Upload Image</button>
            <input type="file" id="fileInput" style="display: none;">
            <button type="button" class="btn predict-btn" id="predictBtn" title="Process the uploaded image">Predict</button>
        </form>

        <!-- Image Preview & Result -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card preview-card">
                    <div class="card-body text-center">
                        <video autoplay id="video" class="preview" poster="default.jpg"></video>
                        <img id="imagePreview" class="preview" src="" style="display: none;">
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card preview-card">
                    <div class="card-body text-center">
                        <h5>Prediction Results</h5>
                        <div id="result" class="result-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Animation -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
