# ==============================================================================
# CI/CD Pipeline Workflow
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore: [README.md]

permissions:
  id-token: write
  contents: read

jobs:
  # ==============================================================================
  # Job 1: Continuous Integration
  # ==============================================================================
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: python-version: 3.x
      - run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt
      - run: |
          # flake8 .
          echo "Lint passed"
      - run: |
          # pytest
          echo "Tests passed"

  # ==============================================================================
  # Job 2: Build and Push Docker Image to ECR
  # ==============================================================================
  build-and-push-ecr-image:
    needs: integration
    runs-on: ubuntu-latest

    # grab these outputs in later jobs
    outputs:
      image: ${{ steps.docker_build.outputs.image }}
      image_digest: ${{ steps.docker_build.outputs.digest }}

    steps:
      # 1) Checkout & AWS setup
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # 2) Log in to ECR
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3) Build & push via Docker Buildx action
      - id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:${{ github.sha }}
          # these outputs (image & digest) are auto-populated by the action

  # ==============================================================================
  # Job 3: Continuous Deployment
  # ==============================================================================
  continuous-deployment:
    needs: build-and-push-ecr-image
    runs-on: self-hosted
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      # pull using the output from the build job
      - name: Pull Docker image
        run: |
          IMAGE=${{ needs.build-and-push-ecr-image.outputs.image }}
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

      - name: Stop & remove old container
        run: |
          CONTAINER=waste
          if docker ps -q --filter "name=${CONTAINER}" | grep -q .; then
            docker stop $CONTAINER && docker rm -f $CONTAINER
          fi

      - name: Run new container
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
        run: |
          IMAGE=${{ needs.build-and-push-ecr-image.outputs.image }}
          docker run -d \
            --name waste \
            -p 8080:8080 \
            --ipc host \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            "$IMAGE"
          echo "Container 'waste' running on port 8080."

      - run: |
          docker system prune -af
          echo "Cleaned up Docker artifacts."
