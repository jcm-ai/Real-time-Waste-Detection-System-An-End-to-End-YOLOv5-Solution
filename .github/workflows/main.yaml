# ==============================================================================
# CI/CD Pipeline Workflow
#
# Automates:
#   1. CI (lint/tests)
#   2. Build & push Docker→AWS ECR
#   3. Deploy on a self-hosted runner
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  # pull_request:
  #   branches: [main]
  #   types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

jobs:
  # ==============================================================================
  # JOB 1: Continuous Integration
  # ==============================================================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt
          echo "✅ Dependencies installed."

      - name: Lint code
        run: |
          echo "🔍 Linting..."
          # flake8 .
          echo "✅ Lint complete."

      - name: Run unit tests
        run: |
          echo "🧪 Testing..."
          # pytest
          echo "✅ Tests passed."

  # ==============================================================================
  # JOB 2: Build & Push ECR Image
  # ==============================================================================
  build-and-push-ecr-image:
    name: Build & Push ECR Image
    needs: integration
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}
      image_digest: ${{ steps.build-image.outputs.image_digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push Docker image
        id: build-image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG:      ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # export for downstream jobs
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' \
                   $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG)
          echo "image_digest=$digest" >> $GITHUB_OUTPUT

  # ==============================================================================
  # JOB 3: Continuous Deployment
  # ==============================================================================
  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # DEBUG + Pull the newly built image
      - name: Pull Docker image (debug + pull)
        env:
          IMAGE: ${{ needs.build-and-push-ecr-image.outputs.image }}
        run: |
          echo "🔍 DEBUG: IMAGE='$IMAGE'"
          if [ -z "$IMAGE" ]; then
            echo "❌ ERROR: IMAGE is empty! Check build-and-push job outputs."
            exit 1
          fi
          echo "📥 Pulling Docker image..."
          docker pull "$IMAGE"

      - name: Stop & remove existing container
        run: |
          CONTAINER="waste"
          if docker ps -q --filter "name=${CONTAINER}" | grep -q .; then
            echo "🛑 Stopping $CONTAINER..."
            docker stop $CONTAINER
            echo "🗑 Removing $CONTAINER..."
            docker rm -f $CONTAINER
          else
            echo "ℹ️ No existing $CONTAINER to stop."
          fi

      - name: Run Docker container
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
        run: |
          docker run -d \
            --name waste \
            -p 8080:8080 \
            --ipc host \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            $IMAGE
          echo "🚀 Container 'waste' running on port 8080."

      - name: Clean up Docker resources
        run: |
          docker system prune -af
          # docker volume prune -f
          echo "🧹 Docker cleanup complete."
